[project]
name = "mapce"
version = "0.1.0"
description = "Personal RAG knowledge base for embodied AI and robotics research"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "kzzzza" },
]
dependencies = [
    "fastembed==0.8.0",
    "lancedb>=0.17.0",
    "numpy>=1.26.0",
    "httpx>=0.27.0",
    "socksio>=1.0.0",
    "mcp>=1.0.0,<2.0.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "tree-sitter>=0.23.0",
    "pyarrow>=16.0.0",
    "tqdm>=4.66.0",
    "psutil>=7.2.2",
    "starlette>=1.2.1",
    "uvicorn>=0.49.0",
    "rich>=13.8.0",
    "textual>=8.2.8",
    "typer>=0.25.1",
]

[project.scripts]
mapce = "mapce.cli:main"
mapce-mcp = "mapce.mcp.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mapce"]

[tool.hatch.build.targets.wheel.force-include]
"skills" = "mapce/bundled_skills"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
]
